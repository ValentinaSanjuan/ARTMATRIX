server:
  port: 8080

spring:
  application:
    name: artmatrix-api
  datasource:
    # La base "artmatrix" se crea sola si no existe; Flyway crea las tablas y los datos.
    url: jdbc:mysql://localhost:3306/artmatrix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
    username: ${DB_USUARIO:artmatrix}
    password: ${DB_CLAVE:artmatrix}
  jpa:
    hibernate:
      ddl-auto: none        # el esquema lo maneja Flyway (db/migration)
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si las tablas ya se crearon con infra/mysql/artmatrix-completo.sql,
    # Flyway las da por aplicadas (versiones 1 y 2) y no las vuelve a crear.
    baseline-on-migrate: true
    baseline-version: 2

artmatrix:
  cors:
    origenes: http://localhost:5173
  jwt:
    # Cámbialo en producción (mínimo 32 caracteres).
    secreto: ${JWT_SECRETO:artmatrix-clave-de-desarrollo-cambiar-en-produccion-2026}
    horas-validez: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
