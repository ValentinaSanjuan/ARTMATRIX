server:
  # En la nube (Render) el puerto llega en la variable PORT.
  port: ${PORT:8080}

spring:
  application:
    name: artmatrix-api
  datasource:
    # Local: la base "artmatrix" se crea sola si no existe; Flyway crea las tablas y los datos.
    # Nube: define DB_URL (por ejemplo la de Aiven con sslMode=REQUIRED), DB_USUARIO y DB_CLAVE.
    url: ${DB_URL:jdbc:mysql://localhost:3306/artmatrix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
    username: ${DB_USUARIO:artmatrix}
    password: ${DB_CLAVE:artmatrix}
    hikari:
      maximum-pool-size: 5     # suficiente para el plan gratuito y abre menos conexiones al arrancar
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: none        # el esquema lo maneja Flyway (db/migration)
    open-in-view: false
    properties:
      # Arranque más rápido: Hibernate no consulta los metadatos de la base al iniciar.
      hibernate.boot.allow_jdbc_metadata_access: false
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jmx:
    enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si la base ya tenía las tablas (creadas antes con un script manual),
    # Flyway da por aplicadas las versiones 1 y 2 y no las vuelve a crear.
    baseline-on-migrate: true
    baseline-version: 2

artmatrix:
  cors:
    # Separa varias direcciones con comas (por ejemplo la de Vercel).
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  jwt:
    # Cámbialo en producción (mínimo 32 caracteres).
    secreto: ${JWT_SECRETO:artmatrix-clave-de-desarrollo-cambiar-en-produccion-2026}
    horas-validez: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
