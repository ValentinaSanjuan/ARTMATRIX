# Alternativa a MySQL instalado: levanta MySQL 8.0 en Docker.
#   cd infra
#   docker compose up -d
name: artmatrix

services:
  mysql:
    image: mysql:8.0
    container_name: artmatrix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: artmatrix
      MYSQL_USER: artmatrix
      MYSQL_PASSWORD: artmatrix
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-partmatrix", "-uartmatrix"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
