# Despliegue del backend en Render (New > Blueprint > este repositorio).
# Los valores marcados con sync: false se escriben en el panel de Render.
services:
  - type: web
    name: artmatrix-api
    runtime: docker
    plan: free
    rootDir: services/api/artmatrix-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USUARIO
        sync: false
      - key: DB_CLAVE
        sync: false
      - key: CORS_ORIGENES
        sync: false
      - key: JWT_SECRETO
        generateValue: true
